# HGC module-production day schedule — 4-BATCH scenario
# Baseline day but the gantry assembles only 4 batches (carryover for dropped batches removed automatically).
#
# Regenerate:
#   ~/python-environments/webplot/bin/python make_schedule_figure.py scenario_4batches.yaml
#
# One file = one scenario. The schedule is computed from these assumptions by a
# greedy forward scheduler — change a cycle time, shift, or the carryover list
# and the whole day reflows.

title: Monday — 6 batches/day
subtitle: 8:00 AM–8:00 PM production window

day:
  start: "08:00"
  end: "20:00"

modules_per_batch: 4        # drawn as | | | tick marks on wirebond/encap/test bars

# How many batches the gantry assembles today: keeps the first N of `batches`
# below and drops carryover entries for removed batches. (CLI: --num-batches N)
num_batches: 6

# Today's assembly order (top row). Colors: pastel fills; hatch shade derived.
batches:
  - {name: Batch 1, color: "#8EC3F3"}
  - {name: Batch 2, color: "#F1BB95"}
  - {name: Batch 3, color: "#A4DDB2"}
  - {name: Batch 4, color: "#EFAFCF"}
  - {name: Batch 5, color: "#C5B0E9"}
  - {name: Batch 6, color: "#94D0D1"}

# Minutes per batch (of 4 modules). Per-batch override example:
#   wb_front: {default: 60, Batch 3: 75}
cycle_times_min:
  gantry: {default: 105, Batch 5: 135, Batch 6: 155}
  wb_front: 60
  wb_back: 45
  encap_front: 60
  encap_back: 45
  test: 30

# Who is on shift, and which stations they run. A job can only start if its
# station's crew has enough free people for its whole duration.
crews:
  assembly:                                   # two gantry shifts, 2 people each
    shifts:
      - {people: 1, from: "08:00", to: "16:00", breaks: [["13:00","14:00"]]}   # day shift
      - {people: 1, from: "08:00", to: "16:00", breaks: [["14:00","15:00"]]}   # day shift      
      - {people: 1, from: "13:00", to: "20:00", breaks: [["15:00","16:00"]]}   # evening shift
  wirebond:
    shifts:
      - {people: 1, from: "08:00", to: "16:00", breaks: [["13:00","14:00"]]}   # dedicated wirebonder tech
      - {people: 1, from: "13:00", to: "20:00", breaks: [["15:00","16:00"]]}   # dedicated wirebonder tech      
  encap:
    shifts:
      - {people: 1, from: "08:00", to: "16:00", breaks: [["13:00","14:00"]]}   # dedicated encapsulation tech
      - {people: 1, from: "13:00", to: "20:00", breaks: [["15:00","16:00"]]}   # dedicated encapsulation tech      
  #metrology: {people: 1, shift: ["09:00", "21:00"]}   # OGP
  #  testing:   {people: 1, shift: ["08:00", "16:00"]}   # test stand

# Displayed "People on shift" step chart (an assumption, drawn as configured).
# NOTE: in the reference illustration this shows 5 -> 3 at 4 PM even though the
# crews above sum to 4 after 16:00 — kept as-is to match the reference.
staffing:
  style: bars      # per-person presence bars (use 'steps' for the histogram)
  label: People on shift
  steps:
    - {from: "08:00", people: 4}
    - {from: "13:00", people: 7}    
    - {from: "16:00", people: 3}

# Rows, top to bottom. The gray band spans the crew's staffed window.
# cycle_keys maps this station's pass names to cycle_times_min entries.
# label_style: batch -> "Batch 1"; pass -> "F1"/"B1"; initial -> "T1".
stations:
  - id: gantry
    label: Gantry / OGP
    sublabel: 2 FTE = 105 min 1 = 155
    crew: assembly
    people_per_job: 1
    cycle_keys: {assemble: gantry}
    label_style: batch
#  - id: ogp
#    label: OGP
#    sublabel: 1 person / day
#    crew: metrology
#    cycle_keys: {ogp: ogp}
#    label_style: batch
  - id: wirebonder
    label: Wirebonder
    #sublabel: 1 person / day
    crew: wirebond
    cycle_keys: {F: wb_front, B: wb_back}
    label_style: pass
    module_ticks: true
  - id: encapsulation
    label: Encapsulation
    #sublabel: 1 person / day
    crew: encap
    cycle_keys: {F: encap_front, B: encap_back}
    label_style: pass
    module_ticks: true
#  - id: test
#    label: Test stand 1
#    sublabel: 1 student / day
#    crew: testing
#    cycle_keys: {T: test}
#    label_style: pass
#    module_ticks: true

# Afternoon crew handoff marker (annotation only).
#handoff:
#  time: "13:15"
#  stations: [gantry, wirebonder, encapsulation]

# Work created for each of today's batches (drawn solid).
# `after: <station>` = wait for this batch's job at that station today.
today_flow:
  - {station: gantry, pass: assemble}
  #- {station: ogp, pass: ogp}
  # backside bonding of a fresh batch must start by 5 PM, else it waits for morning
  - {station: wirebonder, pass: B, after: gantry, batches: [Batch 1, Batch 2, Batch 3, Batch 4 ]}
  # same-day backside encap only for the first three batches; Batch 4 waits for morning
  - {station: encapsulation, pass: B, after: wirebonder, batches: [Batch 1]}


# Prior-day / older WIP entering this morning's queues (drawn hatched).
# Listed order = queue order at each station; carryover runs before today's
# work unless marked `priority: late`. `after:` may reference another job by
# station (+ pass, same batch) — e.g. frontside encapsulation follows this
# morning's frontside wirebond of the same batch.
carryover:
  # OGP: batches 5 and 6 missed metrology yesterday (assembled after 4 PM)
  # Wirebonder: frontside passes for yesterday's batches (backside cured overnight)
  - {station: wirebonder, batch: Batch 4, pass: F}
  - {station: wirebonder, batch: Batch 5, pass: F}
  - {station: wirebonder, batch: Batch 6, pass: F}
  - {station: wirebonder, batch: Batch 1, pass: F}      
  - {station: wirebonder, batch: Batch 2, pass: F}
  - {station: wirebonder, break: 30, label: ""}  
  - {station: wirebonder, batch: Batch 5, pass: B}  
  - {station: wirebonder, batch: Batch 6, pass: B}
  - {station: wirebonder, batch: Batch 3, pass: F}  

  # Batch 3 frontside is deliberately last (its encap runs first thing tomorrow)
  #- {station: wirebonder, batch: Batch 3, pass: F, priority: late}
  # Encapsulation: backside of yesterday's Batch 2 spilled overnight; frontside
  # encap chases this morning's frontside wirebonds; older backsides fill the
  # afternoon.
  - {station: encapsulation, batch: Batch 2, pass: B}
  - {station: encapsulation, batch: Batch 3, pass: F}
  - {station: encapsulation, batch: Batch 4, pass: F, after: {station: wirebonder, pass: F}}
  - {station: encapsulation, batch: Batch 5, pass: F, after: {station: wirebonder, pass: F}}
  - {station: encapsulation, batch: Batch 6, pass: F, after: {station: wirebonder, pass: F}}    
  - {station: encapsulation, batch: Batch 1, pass: F, after: {station: wirebonder, pass: F}}
  - {station: encapsulation, break: 30, label: ""}  
  - {station: encapsulation, batch: Batch 2, pass: F, after: {station: wirebonder, pass: F}}
  - {station: encapsulation, batch: Batch 3, pass: B}
  - {station: encapsulation, batch: Batch 4, pass: B}
  - {station: encapsulation, batch: Batch 5, pass: B}
  - {station: encapsulation, batch: Batch 6, pass: B}
  
  # Test stand: fully-encapsulated older modules; each batch is released to
#  # test once its frontside wirebond finishes this morning.
#  - {station: test, batch: Batch 3, pass: T}
#  - {station: test, batch: Batch 4, pass: T, after: {station: wirebonder, pass: F}}
#  - {station: test, batch: Batch 5, pass: T, after: {station: wirebonder, pass: F}}
#  - {station: test, batch: Batch 6, pass: T, after: {station: wirebonder, pass: F}}
#  - {station: test, batch: Batch 1, pass: T, after: {station: wirebonder, pass: F}}
#  - {station: test, batch: Batch 2, pass: T, after: {station: wirebonder, pass: F}}
